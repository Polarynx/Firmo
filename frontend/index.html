<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firmo: the workspace for writing papers</title>
    <meta name="description" content="One workspace for the whole paper. Firmo finds real academic sources, marks every claim in your draft that needs backing, verifies your citations, and builds your works-cited page as you write." />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Newsreader carries a true optical-size axis and a real italic, so a
      masthead is cut like a masthead and a 13px card heading like body copy.
      Archivo is the utility grotesque: more character than a neutral UI sans at
      11px, and Archivo Narrow handles the dense metadata rows. IBM Plex Mono
      reads as an institutional record rather than as a code editor.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,300;1,6..72,400;1,6..72,500;1,6..72,600&family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
